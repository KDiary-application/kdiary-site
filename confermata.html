<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confermata · KDiary</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="center">
  <div class="check" aria-hidden="true">✓</div>
  <h1>Email confermata</h1>
  <p>Tutto a posto! Torna nell'app <strong>KDiary</strong> e premi <strong>“Ho confermato”</strong>.</p>
  <p class="soft">Se l'app era già aperta, l'accesso si attiva da solo.</p>
  <hr style="border:0;border-top:1px solid var(--light);margin:30px 0">
  <h1 style="font-size:22px">Email confirmed</h1>
  <p>All set! Go back to the <strong>KDiary</strong> app and tap <strong>“I confirmed”</strong>.</p>
  <p class="soft">If the app is already open, sign-in turns on by itself.</p>
</main>
</body>
</html>
